<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feed</title>
  <link rel="stylesheet" type="" href="{{url_for('static', filename='css/styles.css')}}">
</head>
<body class="body-feed">
   
  <nav id="nav-bar" class="nav-bar">
    
    <ul class="nav-links" id="nav-links">
      <li class="home">
        <a href="{{url_for('feed')}}">
        <svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 20 20"><path fill="#87fefe" fill-rule="evenodd" d="M1 11C.08 11-.352 9.863.336 9.253l9-8a1 1 0 0 1 1.328 0l9 8C20.352 9.863 19.92 11 19 11h-1v7a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1v-7H1Zm6 6v-5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v5h3v-7a1 1 0 0 1 .512-.873L10 3.337l-6.512 5.79A1 1 0 0 1 4 10v7h3Zm2 0v-4h2v4H9Z" clip-rule="evenodd"/></svg>
      </a></li>
      <li id="contacts">
        <svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 8 8"><path fill="#87fefe" d="M5.5 0c-.51 0-.95.35-1.22.88c.45.54.72 1.28.72 2.13c0 .29-.03.55-.09.81c.19.11.38.19.59.19c.83 0 1.5-.9 1.5-2s-.67-2-1.5-2zm-3 1C1.67 1 1 1.9 1 3s.67 2 1.5 2S4 4.1 4 3s-.67-2-1.5-2zm4.75 3.16c-.43.51-1.02.82-1.69.84c.27.38.44.84.44 1.34V7h2V5.34c0-.52-.31-.97-.75-1.19zm-6.5 1C.31 5.38 0 5.83 0 6.35v1.66h5V6.35c0-.52-.31-.97-.75-1.19C3.8 5.69 3.19 6 2.5 6S1.2 5.68.75 5.16z"/></svg>
      </li>
      <li id="add-post"><svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 24 24"><path fill="#87fefe" d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10s10-4.477 10-10S17.523 2 12 2zm5 11h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg></li>
      <li id="smile-tools">
        <svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 1024 1024"><path fill="#87fefe" d="M512 1024q-104 0-199-40.5t-163.5-109T40.5 711T0 512t40.5-199t109-163.5T313 40.5T512 0t199 40.5t163.5 109t109 163.5t40.5 199t-40.5 199t-109 163.5t-163.5 109t-199 40.5zM288 256q-40 0-68 37.5T192 384t28 90.5t68 37.5t68-37.5t28-90.5t-28-90.5t-68-37.5zm448 0q-40 0-68 37.5T640 384t28 90.5t68 37.5t68-37.5t28-90.5t-28-90.5t-68-37.5zm64 384H224q-13 0-22.5 9.5T192 672q40 113 117.5 168.5T511 896t202.5-55.5T832 672q0-13-9.5-22.5T800 640zM511 832q-166 0-223-114q0-6 5.5-10t13.5-4h410q8 0 13.5 4t5.5 10q-57 114-225 114z"/></svg>
      </li>
      <li id="account">
        {% if picture %}
        <img src="../static/userpic/{{picture}}" alt="">
        {% else %}
        <svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 24 24" fill="#87fefe"><g fill="none" fill-rule="evenodd"><path d="M24 0v24H0V0h24ZM12.594 23.258l-.012.002l-.071.035l-.02.004l-.014-.004l-.071-.036c-.01-.003-.019 0-.024.006l-.004.01l-.017.428l.005.02l.01.013l.104.074l.015.004l.012-.004l.104-.074l.012-.016l.004-.017l-.017-.427c-.002-.01-.009-.017-.016-.018Zm.264-.113l-.014.002l-.184.093l-.01.01l-.003.011l.018.43l.005.012l.008.008l.201.092c.012.004.023 0 .029-.008l.004-.014l-.034-.614c-.003-.012-.01-.02-.02-.022Zm-.715.002a.023.023 0 0 0-.027.006l-.006.014l-.034.614c0 .012.007.02.017.024l.015-.002l.201-.093l.01-.008l.003-.011l.018-.43l-.003-.012l-.01-.01l-.184-.092Z"/><path fill="#87fefe" d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10s10-4.477 10-10S17.523 2 12 2ZM8.5 9.5a3.5 3.5 0 1 1 7 0a3.5 3.5 0 0 1-7 0Zm9.758 7.484A7.985 7.985 0 0 1 12 20a7.985 7.985 0 0 1-6.258-3.016C7.363 15.821 9.575 15 12 15s4.637.821 6.258 1.984Z"/></g></svg>
        {% endif %}
      </li>
    </ul>
    
  </nav>
    

    <div class="feed-container" id="feed-container">
        {% for posts in  user_posts%}
          <div class="post">
            <div class="user-container">
              <div class="image">

              </div>
              <div class="data">
                <p style="font-size: 20px; color: black;"><strong>{{posts.user.username}}</strong></p>
              </div>
            </div>
            <p><strong>{{posts.post.tittle}}</strong></p>

            <p>{{posts.post.content}}</p>
            {% if posts.post.post_image %}  
            <div class="image-post">
           
              <img src="{{ url_for('static', filename='post_images/' + posts.post.post_image)}}" alt="">
            </div>
            {% endif %}
          </div>
        {% endfor%}
    </div>
     <div class="account_page" id="account_page">
      <div class="pic-user">
        <form action="" method="post" id="user-account-changes">
          <div class="change_picture" id="change_picture">
            <input type="file" name="user-picture" id="user-picture" >
            <p>Change Profile Picture</p>
          </div>

    
            {% if picture %}
               <img src="../static/userpic/{{picture}}" alt="">
            {%else%}
                <div class="user-image" id="user-image">
                </div>
            {% endif %}
          <div class="form-updater" id="">
           

            
       <div class="field">
        
       
          <label for="current-username" style="font-weight:bolder;">Username</label> 
          <div class="input-group">
            
        
          <input type="text" name="current-username" id="current-username" placeholder="{{username}}" disabled>

          <div class="change-username" id="change-username">
               <svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 24 24"><g fill="none" stroke="#87fefe" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path stroke-dasharray="20" stroke-dashoffset="20" d="M3 21H21"><animate fill="freeze" attributeName="stroke-dashoffset" dur="0.3s" values="20;0"/></path><path stroke-dasharray="44" stroke-dashoffset="44" d="M7 17V13L17 3L21 7L11 17H7"><animate fill="freeze" attributeName="stroke-dashoffset" begin="0.4s" dur="0.6s" values="44;0"/></path><path stroke-dasharray="8" stroke-dashoffset="8" d="M14 6L18 10"><animate fill="freeze" attributeName="stroke-dashoffset" begin="1s" dur="0.2s" values="8;0"/></path></g></svg>
            </div>
          </div>
        </div>

        <div class="field">
          
        
          <label for="current-mail">Mail</label>
          <div class="input-group">
            
          
          <input type="text" name="current-mail" id="current-mail" placeholder="{{mail}}" disabled>
          <div class="change-mail" id="change-mail">
            <svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 24 24"><g fill="none" stroke="#87fefe" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path stroke-dasharray="20" stroke-dashoffset="20" d="M3 21H21"><animate fill="freeze" attributeName="stroke-dashoffset" dur="0.3s" values="20;0"/></path><path stroke-dasharray="44" stroke-dashoffset="44" d="M7 17V13L17 3L21 7L11 17H7"><animate fill="freeze" attributeName="stroke-dashoffset" begin="0.4s" dur="0.6s" values="44;0"/></path><path stroke-dasharray="8" stroke-dashoffset="8" d="M14 6L18 10"><animate fill="freeze" attributeName="stroke-dashoffset" begin="1s" dur="0.2s" values="8;0"/></path></g></svg>
          </div>
          </div>

        </div>

        <div class="field">
          
        
          <label for="current-password">Password</label>
          <div class="input-group">
            
          
          <input type="password" name="current-password" id="current-password" placeholder="secret :p" disabled>
          <div class="change-pass" id="change-pass">
            <svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 24 24"><g fill="none" stroke="#87fefe" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path stroke-dasharray="20" stroke-dashoffset="20" d="M3 21H21"><animate fill="freeze" attributeName="stroke-dashoffset" dur="0.3s" values="20;0"/></path><path stroke-dasharray="44" stroke-dashoffset="44" d="M7 17V13L17 3L21 7L11 17H7"><animate fill="freeze" attributeName="stroke-dashoffset" begin="0.4s" dur="0.6s" values="44;0"/></path><path stroke-dasharray="8" stroke-dashoffset="8" d="M14 6L18 10"><animate fill="freeze" attributeName="stroke-dashoffset" begin="1s" dur="0.2s" values="8;0"/></path></g></svg>
            
          </div>
          </div>
        </div>
          <button type="button" id="update-data">Actualizar Información</button>
           </div>
           
        </form>
      </div>
    </div>
    <div class="pop-up-post" id="pop-up-post">
      <form action="/create-posts" method="post">
        <label for="tittle">Post Tittle:</label>
        <input type="text" name="titlle" id="tittle">
        <label for="content">Content:</label>
        <textarea rows="4" cols="4" id="content" name="content"></textarea>
        <label for="add-pass">Add password?</label>
        <input type="checkbox" name="yesPass" id="yesPass">
        <div class="pass-post-container" id="pass-post-container">
          <label for="password">Enter a password:</label>
          <input type="text" name="password" id="password">          
        </div>
        <label for="image">Add image (optional):</label>
        <input type="file" id="image" >
        <button type="button" id="add_post_btn">Add Post</button>
      </form>
    </div>
<script>
  const add_post = document.getElementById('add-post');
  const addpost_form = document.getElementById('pop-up-post');
  const tittle = document.getElementById('tittle');
  const content = document.getElementById('content');
  const pass = document.getElementById('password');
  const imagePost = document.getElementById('image');
  const add_post_btn = document.getElementById('add_post_btn');
  const feed_container = document.getElementById('feed-container');
  const account_btn = document.getElementById('account');
  const account_block = document.getElementById('account_page');
 
  let active_changes = false;

  document.getElementById('update-data').addEventListener("click", async (e) => {
    e.preventDefault();
    const response = await fetch(`/user-changes`, {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body: JSON.stringify({
          "new-username":document.getElementById('current-username').
          value,
          "new-mail":document.getElementById('current-mail').value,
          "new-pass":document.getElementById('current-password').value
        })
    });

    const dataUpdateUser = await response.json();

    if(dataUpdateUser.success2){
      window.location.reload();

    }
    else{
      console.log("error puta");
    }

  });
  document.getElementById('change-username').addEventListener("click", ()=>{
    active_changes =!active_changes;
    if(active_changes){
      document.getElementById('current-username').disabled = false;
    }
    else{
      document.getElementById('current-username').disabled = true;
    }
  });
  feed_container.classList.add('active');
  account_btn.addEventListener("click",()=> {
    
    feed_container.classList.remove('active');
    account_block.classList.add('active');
    console.log(account_block);
  });
 
  document.getElementById('change-mail').addEventListener("click",()=>{
    active_changes = !active_changes;
    if(active_changes){
      document.getElementById('current-mail').disabled = false;
    }
    else{
      document.getElementById('current-mail').disabled = true;
    }
  });

  document.getElementById('change-pass').addEventListener("click",()=>{
    active_changes = !active_changes;
    if(active_changes){
      document.getElementById('current-password').disabled = false;
      
    }
    else{
      document.getElementById('current-password').disabled = true;
    }
  });
  add_post.addEventListener("click", ()=> {
      addpost_form.classList.add('active');
  });
  console.log(feed_container);
  add_post_btn.addEventListener("click", async (e) => {
    const formData = new FormData();

    formData.append("tittle", tittle.value);
    formData.append("content", content.value);
    formData.append("pass", pass.value);

    if(imagePost.files[0]){
      formData.append("image", imagePost.files[0]);
    }
    const response = await fetch('/create-posts',{
      method:"POST",
      body: formData
    });
    const data = await response.json();

    if(data.success){
       
       addpost_form.classList.remove('active');
       location.reload();

    }else{
      alert("dont");
    }
  });

  const checkPass = document.getElementById('yesPass');

  checkPass.addEventListener("change", ()=>{
    if(checkPass.checked){
      document.getElementById('pass-post-container').classList.add('active');
    }
    else{
      document.getElementById('pass-post-container').classList.remove('active');
    }
  });
  //user-account-changes
  const user_picture_input = document.getElementById('user-picture');
  const user_account_changes = document.getElementById('user-account-changes');
  user_picture_input.addEventListener("change", async (e)=>{
    e.preventDefault();
    const formDataUser = new FormData();
    if (user_picture_input.files[0]) {
      formDataUser.append("userpic", user_picture_input.files[0])
    }

    const response = await fetch(`/user-changes`,{
      method:"POST",
      body:formDataUser
    });

    const dataUser = await response.json();

    if(dataUser.success){
      window.location.reload();
      feed_container.classList.remove('active');
      account_block.classList.add('active');
    }
    
  });
  
</script>
</body>
</html>
