<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account</title>
  <link rel="stylesheet" href="{{url_for('static', filename='css/styles.css')}}">
</head>
<body class="body-create">
  <div class="form-container" id="create-container">
     <form id='create-form' >
       <h1>Create Account</h1>
       <label for="username">Enter an username:</label>
       <input type="text" name="username" id="username">
       <span id="tag-name-input-ac" class="tag">
         Please, enter an username!
       </span>
       <label for="mail">Enter your email:</label>
       <input type="text" name="mail" id="mail">
       <span id="tag-mail-input-ac" class="tag">Please, enter an username</span>
       <label for="password">Enter an password:</label>
       <input type="password" name="password" id="password">
      <span class="tag" id="tag-pass-input-ac">Enter a password!</span>
      <button type="button" id="button-sub-ac">Create Account</button>
     </form>
  </div>
  <script>
    const button_submit = document.getElementById('button-sub-ac');
    const username_field = document.getElementById('username');
    const mail_field = document.getElementById('mail');
    const pass_field = document.getElementById('password');
    const tag_name = document.getElementById('tag-name-input-ac');
    const tag_mail = document.getElementById('tag-mail-input-ac');
    const tag_pass = document.getElementById('tag-pass-input-ac');
    button_submit.addEventListeners('click', ()=> {
    
      if(username_field.value == ""){
         tag_name.classList.add('active');
      }
      if(mail_field.value == ""){
        tag_mail.classList.add('active');
      }
      if(pass_field.value == ""){
        tag_pass.classList.add('active');
      }

    });
  </script>
</body>
</html>
